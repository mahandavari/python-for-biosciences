<path d="M350 435 L525 490 L350 545 L175 490 Z"/>
<path d="M690 460 H955 L935 520 H670 Z"/>
<rect x="150" y="580" width="400" height="65"/>
<path d="M200 675 H520 L500 735 H180 Z"/>
<path d="M350 770 L525 825 L350 880 L175 825 Z"/>
<path d="M690 795 H935 L915 855 H670 Z"/>
<path d="M350 915 L525 970 L350 1025 L175 970 Z"/>
<path d="M690 940 H935 L915 1000 H670 Z"/>
<path d="M200 1060 H520 L500 1110 H180 Z"/>
<rect x="735" y="1110" width="150" height="50" rx="25"/>
</g>
