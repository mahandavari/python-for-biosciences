<path d="M350 400 V435"/><path d="M525 490 H680"/>
<path d="M350 545 V580"/><path d="M350 645 V675"/>
<path d="M350 735 V770"/><path d="M525 825 H680"/>
<path d="M350 880 V915"/><path d="M525 970 H680"/>
<path d="M350 1025 V1060"/>
<path d="M945 250 H1000 V1135 H885"/>
<path d="M945 490 H1000"/><path d="M925 825 H1000"/>
<path d="M925 970 H1000"/><path d="M350 1110 V1135 H735"/>
</g>
<g font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#162a40">
<text x="350" y="52">Start</text><text x="350" y="143">Read A, T, G, C counts</text>
<text x="350" y="258">Any count &lt; 0?</text><text x="810" y="257">Show invalid negative</text>
<text x="350" y="378">Total = A + T + G + C</text>
<text x="350" y="498">Total == 0?</text><text x="810" y="497">Show invalid zero total</text>
<text x="350" y="607">GC% = (G + C) / total * 100</text><text x="350" y="632">Artificial teaching bands only</text>
<text x="350" y="713">Show total and GC%</text>
<text x="350" y="833">GC% &lt; 40?</text><text x="800" y="832">Show low</text>
<text x="350" y="978">GC% &lt;= 60?</text><text x="800" y="977">Show middle</text>
<text x="350" y="1093">Show high</text><text x="810" y="1143">End</text>
<text x="590" y="240">Yes</text><text x="380" y="330">No</text>
<text x="590" y="480">Yes</text><text x="380" y="570">No</text>
<text x="590" y="815">Yes</text><text x="380" y="905">No</text>
<text x="590" y="960">Yes</text><text x="380" y="1050">No</text>
</g></svg>
