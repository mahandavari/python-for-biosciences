<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1180" role="img" aria-labelledby="title desc">
<title id="title">Validated GC calculation with classroom bands</title>
<desc id="desc">Reject negative counts, reject zero total, calculate GC, select low below 40, middle through 60, otherwise high. All branches end.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#25364a"/></marker></defs>
